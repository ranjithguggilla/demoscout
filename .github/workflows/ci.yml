name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          # No pip cache: hnswlib wheels built with -march=native on one runner
          # can SIGILL when restored on a weaker-CPU runner.
      - name: Install
        env:
          HNSWLIB_NO_NATIVE: "1"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt --no-binary=hnswlib
          pip install -e . --no-deps
      - run: ruff check .
      - run: pytest -q --cov=demoscout

  train:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        env:
          HNSWLIB_NO_NATIVE: "1"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --no-binary=hnswlib
          pip install -e . --no-deps
      - run: demoscout run --boot 100
      - uses: actions/upload-artifact@v4
        with:
          name: demoscout-model
          path: |
            outputs/scout.joblib
            outputs/metrics.json
            outputs/tables
            assets
